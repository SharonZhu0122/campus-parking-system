<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 680" width="1010" height="680" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#555"/></marker>
  </defs>
  <rect width="1010" height="680" fill="#ffffff"/>

  <!-- users -->
  <text x="320" y="30" text-anchor="middle" font-size="15" fill="#333">Visitor  |  Registered driver  |  Admin</text>

  <!-- frontend -->
  <rect x="120" y="45" width="400" height="105" rx="10" fill="#e6f0fb" stroke="#3b73b9"/>
  <text x="320" y="72" text-anchor="middle" font-size="17" font-weight="700" fill="#143e6e">Frontend: React + Vite</text>
  <text x="320" y="94" text-anchor="middle" font-size="13" fill="#245a96">hosted on Vercel</text>
  <text x="320" y="116" text-anchor="middle" font-size="12.5" fill="#245a96">Gate cards and maps, Busy times, Assistant and FAQ,</text>
  <text x="320" y="134" text-anchor="middle" font-size="12.5" fill="#245a96">My vehicle and Account, Admin violations and questions</text>

  <!-- arrows frontend <-> backend -->
  <line x1="260" y1="150" x2="260" y2="200" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="200" x2="380" y2="150" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="250" y="180" text-anchor="end" font-size="12" fill="#555">1 request (REST, JWT)</text>
  <text x="390" y="190" font-size="12" fill="#555">4 response (JSON)</text>

  <!-- backend -->
  <rect x="40" y="200" width="620" height="290" rx="10" fill="#fafafa" stroke="#999" stroke-dasharray="6 4"/>
  <text x="350" y="224" text-anchor="middle" font-size="17" font-weight="700" fill="#222">Backend: Node.js + Express</text>
  <text x="350" y="243" text-anchor="middle" font-size="13" fill="#666">hosted on Railway, JWT sign-in with visitor, user and admin roles</text>

  <rect x="60" y="260" width="270" height="215" rx="8" fill="#eeecfd" stroke="#6a5fc8"/>
  <text x="195" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2370">API routes</text>
  <text x="195" y="306" text-anchor="middle" font-size="12.5" fill="#2a2370">login, register, password reset</text>
  <text x="195" y="326" text-anchor="middle" font-size="12.5" fill="#2a2370">gates: occupancy, busy times, forecast</text>
  <text x="195" y="346" text-anchor="middle" font-size="12.5" fill="#2a2370">me: my vehicle, account settings</text>
  <text x="195" y="366" text-anchor="middle" font-size="12.5" fill="#2a2370">admin: add, edit, resolve violations</text>
  <text x="195" y="386" text-anchor="middle" font-size="12.5" fill="#2a2370">inquiries, alerts, assistant</text>
  <text x="195" y="420" text-anchor="middle" font-size="12" fill="#5a5190">checks the token and the role first</text>
  <text x="195" y="440" text-anchor="middle" font-size="12" fill="#5a5190">(401 without login, 403 if not admin)</text>

  <rect x="350" y="260" width="290" height="215" rx="8" fill="#eeecfd" stroke="#6a5fc8"/>
  <text x="495" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#2a2370">Services</text>
  <text x="495" y="306" text-anchor="middle" font-size="12.5" fill="#2a2370">Rule engine (3 violation rules)</text>
  <text x="495" y="326" text-anchor="middle" font-size="12.5" fill="#2a2370">Data generator (every 2 minutes)</text>
  <text x="495" y="346" text-anchor="middle" font-size="12.5" fill="#2a2370">Typical-day model (NZ time)</text>
  <text x="495" y="366" text-anchor="middle" font-size="12.5" fill="#2a2370">Forecast: average, regression, backtest</text>
  <text x="495" y="386" text-anchor="middle" font-size="12.5" fill="#2a2370">Capacity guard and housekeeping</text>
  <text x="495" y="406" text-anchor="middle" font-size="12.5" fill="#2a2370">Assistant client and mailer</text>
  <text x="495" y="440" text-anchor="middle" font-size="12" fill="#5a5190">93 automated tests (Jest, Supertest)</text>

  <!-- DB -->
  <line x1="260" y1="490" x2="260" y2="545" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="380" y1="545" x2="380" y2="490" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <text x="250" y="522" text-anchor="end" font-size="12" fill="#555">2 query (Sequelize)</text>
  <text x="390" y="522" font-size="12" fill="#555">3 rows</text>
  <rect x="120" y="545" width="400" height="115" rx="10" fill="#e3f4ec" stroke="#2f8f64"/>
  <text x="320" y="572" text-anchor="middle" font-size="17" font-weight="700" fill="#0f4a33">MySQL database</text>
  <text x="320" y="592" text-anchor="middle" font-size="13" fill="#1d6b4b">hosted on Railway</text>
  <text x="320" y="616" text-anchor="middle" font-size="12.5" fill="#1d6b4b">Users, GateAreas, ParkingEvents,</text>
  <text x="320" y="635" text-anchor="middle" font-size="12.5" fill="#1d6b4b">Violations, Inquiries, PasswordResets</text>

  <!-- external -->
  <text x="830" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#444">External services</text>
  <rect x="700" y="245" width="260" height="70" rx="8" fill="#fdf1e3" stroke="#d98a2b"/>
  <text x="830" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a0c">Google Gemini API</text>
  <text x="830" y="293" text-anchor="middle" font-size="12.5" fill="#7a4a0c">answers from a campus fact sheet</text>
  <rect x="700" y="335" width="260" height="70" rx="8" fill="#fdf1e3" stroke="#d98a2b"/>
  <text x="830" y="362" text-anchor="middle" font-size="14" font-weight="700" fill="#7a4a0c">Brevo email API</text>
  <text x="830" y="383" text-anchor="middle" font-size="12.5" fill="#7a4a0c">password reset links</text>
  <rect x="700" y="425" width="260" height="70" rx="8" fill="#f4f4f4" stroke="#999"/>
  <text x="830" y="452" text-anchor="middle" font-size="14" font-weight="700" fill="#444">PayMyPark, Google Maps</text>
  <text x="830" y="473" text-anchor="middle" font-size="12.5" fill="#666">links from the website only</text>
  <line x1="640" y1="280" x2="700" y2="280" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="640" y1="370" x2="700" y2="370" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <path d="M520 100 H985 V460 H962" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="760" y="92" text-anchor="middle" font-size="12" fill="#777">links opened in the browser</text>
</svg>
