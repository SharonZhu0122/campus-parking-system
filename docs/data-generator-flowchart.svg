<svg width="680" height="990" viewBox="0 0 680 990" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Flowchart for the backend data generator, with parking duration</title>
<desc>Shows how the scheduled data generator script creates a parking event each time it runs, including assigning a parking duration so occupancy can later go back down, then saving the event and running the rule engine, repeating until enough events exist for that tick.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="990" fill="#FFFFFF"/>
<g>
<rect x="220" y="40" width="240" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Cron tick (every 2-5 min)</text>
</g>
<line x1="340" y1="80" x2="340" y2="120" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="120" width="240" height="50" rx="4" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="150" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Pick gate + event count</text>
<line x1="340" y1="170" x2="340" y2="210" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="210" width="240" height="50" rx="4" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Generate plate number</text>
<line x1="340" y1="260" x2="340" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="340,300 470,345 340,390 210,345" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="350" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Valid plate format?</text>
<path d="M210,345 L150,345 L150,235 L220,235" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="155" y="340" font-family="sans-serif" font-size="12" fill="#5F5E5A">No</text>
<line x1="340" y1="390" x2="340" y2="430" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="412" font-family="sans-serif" font-size="12" fill="#5F5E5A">Yes</text>
<rect x="200" y="430" width="280" height="50" rx="4" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Assign type + payment info</text>
<line x1="340" y1="480" x2="340" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="520" width="240" height="50" rx="4" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="550" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Assign parking duration</text>
<line x1="340" y1="570" x2="340" y2="610" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="610" width="240" height="50" rx="4" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="640" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Save event to database</text>
<line x1="340" y1="660" x2="340" y2="700" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="220" y="700" width="240" height="50" rx="4" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="730" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Run rule engine</text>
<line x1="340" y1="750" x2="340" y2="790" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="340,790 470,835 340,880 210,835" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="340" y="840" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">More events this tick?</text>
<path d="M470,835 L530,835 L530,235 L460,235" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="475" y="830" font-family="sans-serif" font-size="12" fill="#5F5E5A">Yes</text>
<line x1="340" y1="880" x2="340" y2="920" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="902" font-family="sans-serif" font-size="12" fill="#5F5E5A">No</text>
<g>
<rect x="220" y="920" width="240" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="945" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Wait for next tick</text>
</g>
</svg>
