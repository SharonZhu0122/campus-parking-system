<svg width="680" height="424" viewBox="0 0 680 424" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Deployment diagram for campus parking system</title>
<desc>Shows where each part of the system runs: the user's browser, the frontend host, the backend host, and the database host, and how they connect over the network.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="424" fill="#FFFFFF"/>
<g>
<rect x="240" y="40" width="200" height="64" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User's browser</text>
<text x="340" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">desktop or mobile</text>
</g>
<g>
<rect x="100" y="180" width="220" height="64" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="210" y="206" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Vercel / Netlify</text>
<text x="210" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">hosts frontend (static)</text>
</g>
<g>
<rect x="360" y="180" width="220" height="64" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="470" y="206" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Render / Railway</text>
<text x="470" y="226" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3C3489">hosts backend (Node.js)</text>
</g>
<g>
<rect x="360" y="320" width="220" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="470" y="346" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Railway / Aiven</text>
<text x="470" y="366" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">hosts MySQL database</text>
</g>
<path d="M340,104 L340,140 L210,140 L210,180" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="215" y="163" font-family="sans-serif" font-size="12" fill="#5F5E5A">loads app</text>
<path d="M340,104 L340,140 L470,140 L470,180" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="400" y="163" font-family="sans-serif" font-size="12" fill="#5F5E5A">API calls (HTTPS)</text>
<line x1="470" y1="244" x2="470" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="282" font-family="sans-serif" font-size="12" fill="#5F5E5A">DB connection</text>
</svg>
