<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#555"/></marker></defs>
  <rect width="900" height="470" fill="#fff"/>
  <rect x="10" y="190" width="125" height="70" rx="35" fill="#e6f0fb" stroke="#3b73b9"/>
  <text x="72" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#143e6e">New parking</text>
  <text x="72" y="242" text-anchor="middle" font-size="14" font-weight="700" fill="#143e6e">record</text>

  <!-- three checks -->
  <g font-size="13" fill="#2a2370">
    <polygon points="290,40 400,90 290,140 180,90" fill="#eeecfd" stroke="#6a5fc8"/>
    <text x="290" y="85" text-anchor="middle">In a reserved</text><text x="290" y="103" text-anchor="middle">bay?</text>
    <polygon points="290,175 410,225 290,275 170,225" fill="#eeecfd" stroke="#6a5fc8"/>
    <text x="290" y="212" text-anchor="middle">Paid hours, unpaid,</text><text x="290" y="230" text-anchor="middle">and not a motorbike?</text><text x="290" y="246" text-anchor="middle" font-size="11" fill="#5a5190">(8:30am to 4:30pm, Mon to Fri, NZ time)</text>
    <polygon points="290,310 400,360 290,410 180,360" fill="#eeecfd" stroke="#6a5fc8"/>
    <text x="290" y="348" text-anchor="middle">Mobility bay, no</text><text x="290" y="366" text-anchor="middle">valid card?</text>
  </g>
  <line x1="170" y1="225" x2="150" y2="225" stroke="none"/>
  <path d="M72 190 V90 H180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <path d="M170 225 H170" stroke="#555"/>
  <line x1="170" y1="225" x2="172" y2="225" stroke="#555"/>
  <path d="M72 260 V360 H180" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="135" y1="225" x2="168" y2="225" stroke="#555" stroke-width="2" marker-end="url(#a)"/>

  <!-- results -->
  <g font-size="13" font-weight="700">
    <rect x="520" y="60" width="190" height="60" rx="8" fill="#fce8e8" stroke="#aa0000"/><text x="615" y="96" text-anchor="middle" fill="#7a0000">Reserved violation</text>
    <rect x="520" y="195" width="190" height="60" rx="8" fill="#fce8e8" stroke="#aa0000"/><text x="615" y="231" text-anchor="middle" fill="#7a0000">Unpaid violation</text>
    <rect x="520" y="330" width="190" height="60" rx="8" fill="#fce8e8" stroke="#aa0000"/><text x="615" y="366" text-anchor="middle" fill="#7a0000">Mobility violation</text>
  </g>
  <line x1="400" y1="90" x2="520" y2="90" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="440" y="82" font-size="12" fill="#555">yes</text>
  <line x1="410" y1="225" x2="520" y2="225" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="450" y="217" font-size="12" fill="#555">yes</text>
  <line x1="400" y1="360" x2="520" y2="360" stroke="#555" stroke-width="2" marker-end="url(#a)"/><text x="440" y="352" font-size="12" fill="#555">yes</text>
  <text x="290" y="432" text-anchor="middle" font-size="12" fill="#555">Each check is separate, so one record can give 0, 1 or more violations.</text>

  <!-- onward -->
  <rect x="760" y="170" width="120" height="110" rx="10" fill="#e3f4ec" stroke="#2f8f64"/>
  <text x="820" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#0f4a33">Open violation</text>
  <text x="820" y="226" text-anchor="middle" font-size="12" fill="#1d6b4b">in the admin</text>
  <text x="820" y="244" text-anchor="middle" font-size="12" fill="#1d6b4b">list, waiting</text>
  <text x="820" y="262" text-anchor="middle" font-size="12" fill="#1d6b4b">for staff</text>
  <path d="M710 90 H735 V200 H760" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="225" x2="760" y2="225" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
  <path d="M710 360 H735 V250 H760" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
</svg>
