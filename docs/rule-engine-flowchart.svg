<svg width="680" height="620" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Flowchart for the parking violation rule engine</title>
<desc>Shows how the rule engine checks a parking event step by step: reserved park, then paid hours with no payment, then mobility park with no valid card, flagging the matching violation or concluding no violation.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="620" fill="#FFFFFF"/>
<g>
<rect x="100" y="40" width="200" height="40" rx="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="200" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Start: new parking event</text>
</g>
<line x1="200" y1="80" x2="200" y2="105" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<polygon points="200,105 320,150 200,195 80,150" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="200" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">In a reserved park?</text>
<line x1="320" y1="150" x2="380" y2="150" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325" y="145" font-family="sans-serif" font-size="12" fill="#5F5E5A">Yes</text>
<g>
<rect x="380" y="130" width="240" height="40" rx="20" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="500" y="155" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">Flag reserved_violation</text>
</g>
<line x1="200" y1="195" x2="200" y2="255" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="228" font-family="sans-serif" font-size="12" fill="#5F5E5A">No</text>
<polygon points="200,255 320,300 200,345 80,300" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="200" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Paid hours + unpaid?</text>
<line x1="320" y1="300" x2="380" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325" y="295" font-family="sans-serif" font-size="12" fill="#5F5E5A">Yes</text>
<g>
<rect x="380" y="280" width="240" height="40" rx="20" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="500" y="305" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">Flag unpaid_violation</text>
</g>
<line x1="200" y1="345" x2="200" y2="405" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="378" font-family="sans-serif" font-size="12" fill="#5F5E5A">No</text>
<polygon points="200,405 320,450 200,495 80,450" fill="#F8F7F4" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="200" y="455" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Mobility, no valid card?</text>
<line x1="320" y1="450" x2="380" y2="450" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325" y="445" font-family="sans-serif" font-size="12" fill="#5F5E5A">Yes</text>
<g>
<rect x="380" y="430" width="240" height="40" rx="20" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="500" y="455" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">Flag mobility_violation</text>
</g>
<line x1="200" y1="495" x2="200" y2="545" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="523" font-family="sans-serif" font-size="12" fill="#5F5E5A">No</text>
<g>
<rect x="100" y="545" width="200" height="40" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="200" y="570" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">No violation</text>
</g>
</svg>
