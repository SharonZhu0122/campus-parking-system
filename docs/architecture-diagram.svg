<svg width="680" height="530" viewBox="0 0 680 530" role="img" xmlns="http://www.w3.org/2000/svg">
<title>System architecture diagram with deployment merged in</title>
<desc>Shows the frontend, backend with its rule engine, prediction engine and priority scorer modules and their connections, the database, and the data generator, with two separate arrows for requests and responses.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="530" fill="#FFFFFF"/>
<g>
<rect x="220" y="40" width="240" height="76" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="64" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Frontend (React)</text>
<text x="340" y="82" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">gate view, admin, kiosk</text>
<text x="340" y="100" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">hosted: Vercel / Netlify</text>
</g>
<line x1="320" y1="116" x2="320" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325" y="142" font-family="sans-serif" font-size="12" fill="#5F5E5A">1 request (REST, JWT)</text>
<line x1="360" y1="180" x2="360" y2="116" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="365" y="164" font-family="sans-serif" font-size="12" fill="#5F5E5A">4 response (JSON)</text>
<rect x="130" y="180" width="420" height="182" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="340" y="200" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Backend (Node.js / Express)</text>
<text x="340" y="216" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">hosted: Render / Railway</text>
<g>
<rect x="150" y="230" width="180" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="240" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">API routes (JWT)</text>
</g>
<g>
<rect x="350" y="230" width="180" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="440" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Rule engine</text>
</g>
<g>
<rect x="150" y="296" width="180" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="240" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Predictions</text>
</g>
<g>
<rect x="350" y="296" width="180" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="440" y="326" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Priority scorer</text>
</g>
<line x1="330" y1="255" x2="350" y2="255" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="240" y1="280" x2="240" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="280" x2="440" y2="296" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="330" y1="321" x2="350" y2="321" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="320" y1="362" x2="320" y2="420" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="325" y="388" font-family="sans-serif" font-size="12" fill="#5F5E5A">2 query (Sequelize)</text>
<line x1="360" y1="420" x2="360" y2="362" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="365" y="405" font-family="sans-serif" font-size="12" fill="#5F5E5A">3 rows</text>
<g>
<rect x="220" y="420" width="240" height="76" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="444" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">MySQL database</text>
<text x="340" y="462" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">4 tables</text>
<text x="340" y="480" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">hosted: Railway / Aiven</text>
</g>
<g>
<rect x="480" y="439" width="160" height="57" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="560" y="463" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Data generator</text>
<text x="560" y="481" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">runs on a schedule</text>
</g>
<line x1="480" y1="467" x2="460" y2="467" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
