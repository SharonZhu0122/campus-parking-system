<svg width="680" height="476" viewBox="0 0 680 476" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Full system architecture diagram for campus parking system</title>
<desc>Shows the frontend, the backend with its rule engine, prediction engine and priority scorer modules, the background data generator, and the MySQL database, and how they connect.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="476" fill="#FFFFFF"/>
<g>
<rect x="230" y="40" width="220" height="64" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Frontend (React)</text>
<text x="340" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0C447C">gate view, admin, kiosk</text>
</g>
<rect x="130" y="160" width="420" height="172" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="340" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Backend (Node.js / Express)</text>
<g>
<rect x="150" y="200" width="180" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="240" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">API routes (JWT)</text>
</g>
<g>
<rect x="350" y="200" width="180" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="440" y="230" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Rule engine</text>
</g>
<g>
<rect x="150" y="266" width="180" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="240" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Predictions</text>
</g>
<g>
<rect x="350" y="266" width="180" height="50" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="440" y="296" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Priority scorer</text>
</g>
<g>
<rect x="250" y="372" width="190" height="64" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="345" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">MySQL database</text>
<text x="345" y="418" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">4 tables</text>
</g>
<g>
<rect x="460" y="372" width="170" height="64" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="545" y="398" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Data generator</text>
<text x="545" y="418" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">creates fake events</text>
</g>
<line x1="340" y1="104" x2="340" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="135" font-family="sans-serif" font-size="12" fill="#5F5E5A">REST calls, JWT</text>
<line x1="340" y1="332" x2="340" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="345" y="352" font-family="sans-serif" font-size="12" fill="#5F5E5A">Sequelize</text>
<line x1="460" y1="404" x2="440" y2="404" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
